# =========================================================
# Supabase Configuration Profile
# =========================================================
# Activa con: SPRING_PROFILES_ACTIVE=supabase,...
# Todos los valores se cargan desde variables de entorno.
# =========================================================

spring:
  datasource:
    url: ${SUPABASE_URL}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATASOURCE_POOL_SIZE:10}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT:600000}
      max-lifetime: ${DATASOURCE_MAX_LIFETIME:1800000}
      # ── Supabase Connection Pooler (Supavisor / PgBouncer) ─────────────────
      # Transaction mode (puerto 6543) → SUPABASE_PREPARE_THRESHOLD=0
      #   El pooler no mantiene estado entre transacciones; los prepared
      #   statements del servidor no son soportados.
      # Session mode (puerto 5432) → SUPABASE_PREPARE_THRESHOLD=5 (default JDBC)
      #   La conexión persiste durante la sesión; prepared statements normales.
      data-source-properties:
        prepareThreshold: ${SUPABASE_PREPARE_THRESHOLD:0}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        jdbc:
          time_zone: UTC
        default_schema: ${SUPABASE_DB_SCHEMA:public}
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMAS:public}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
