# =========================================================
# Supabase Configuration Profile
# Perfil de Configuración de Supabase
# =========================================================
# All values are loaded from environment variables
# Todos los valores se cargan desde variables de entorno
#
# This file contains ONLY Supabase and Flyway configuration.
# Other configurations (server, logging, etc.) are in keygo-run.
#
# Este archivo contiene SOLO configuración de Supabase y Flyway.
# Otras configuraciones (server, logging, etc.) están en keygo-run.
# =========================================================

# Supabase Configuration
supabase:
  # Database connection
  url: ${SUPABASE_URL}
  user: ${SUPABASE_USER}
  password: ${SUPABASE_PASSWORD}

  # Supabase project configuration
  project-id: ${SUPABASE_PROJECT_ID:local-dev}
  api-url: ${SUPABASE_API_URL:http://localhost:54321}
  rest-url: ${SUPABASE_REST_URL:${supabase.api-url}/rest/v1}
  graphql-url: ${SUPABASE_GRAPHQL_URL:${supabase.api-url}/graphql/v1}
  realtime-url: ${SUPABASE_REALTIME_URL:${supabase.api-url}/realtime/v1}
  storage-url: ${SUPABASE_STORAGE_URL:${supabase.api-url}/storage/v1}

  # Authentication keys
  anon-key: ${SUPABASE_ANON_KEY:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}

  # Database details
  db:
    host: ${SUPABASE_DB_HOST:localhost}
    port: ${SUPABASE_DB_PORT:5432}
    name: ${SUPABASE_DB_NAME:keygo}
    schema: ${SUPABASE_DB_SCHEMA:public}

# Spring Data JPA Configuration
spring:
  datasource:
    url: ${supabase.url}
    username: ${supabase.user}
    password: ${supabase.password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATASOURCE_POOL_SIZE:10}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT:600000}
      max-lifetime: ${DATASOURCE_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        jdbc:
          time_zone: UTC
        default_schema: ${supabase.db.schema}
    show-sql: false
    open-in-view: false

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMAS:public}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

