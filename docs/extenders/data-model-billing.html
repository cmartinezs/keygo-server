<!DOCTYPE html>
<html lang="es">

erDiagram
    contractors {
        uuid id PK
        varchar type
        citext billing_email
        varchar status
    }
    contractor_users {
        uuid contractor_id FK
        uuid platform_user_id FK
        varchar role_code
    }
    app_billing_accounts {
        uuid id PK
        uuid client_app_id FK
        uuid tenant_id FK
        uuid tenant_user_id FK
        varchar status
    }
    app_plans {
        uuid id PK
        uuid client_app_id FK
        varchar code
        varchar status
    }
    app_plan_versions {
        uuid id PK
        uuid app_plan_id FK
        varchar version
        varchar status
    }
    app_contracts {
        uuid id PK
        uuid contractor_id FK
        uuid app_billing_account_id FK
        uuid client_app_id FK
        uuid app_plan_version_id FK
        varchar status
    }
    app_subscriptions {
        uuid id PK
        uuid contractor_id FK
        uuid app_billing_account_id FK
        uuid client_app_id FK
        uuid app_plan_version_id FK
        uuid contract_id FK
        varchar status
    }
    invoices {
        uuid id PK
        uuid contractor_id FK
        uuid client_app_id FK
        uuid subscription_id FK
        varchar status
    }
    payment_transactions {
        uuid id PK
        uuid contractor_id FK
        uuid client_app_id FK
        uuid contract_id FK
        uuid subscription_id FK
        varchar status
    }

    contractors ||--o{ contractor_users : manages
    contractors ||--o{ app_contracts : signs
    contractors ||--o{ app_subscriptions : owns
    contractors ||--o{ invoices : receives
    contractors ||--o{ payment_transactions : pays
    app_billing_accounts ||--o{ app_contracts : signs

    app_contracts ||--o{ app_subscriptions : originates
    app_subscriptions ||--o{ invoices : bills
    app_subscriptions ||--o{ payment_transactions : charges
`;
function DataModelBillingPage() {

        h2Links: 'Related pages',

        eyebrow: 'Modelo de Datos · Billing',

        h2Links: 'Páginas relacionadas',

    ['../extenders/data-model-access-control.html', 'Access Control'],

        </div>
      </div>
    </>
  );

KG_mountPage({ activeId: 'datamodelbilling', content: DataModelBillingPage });
