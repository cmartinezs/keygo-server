keygo:
  cors:
    allowed-origins:
      - "${KEYGO_CORS_ALLOWED_ORIGINS:http://localhost:5173}"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  info:
    title: "@project.parent.name@"
    name: "@project.parent.artifactId@"
    version: "@project.parent.version@"
    issuer-base-url: "${KEYGO_ISSUER_BASE_URL:http://localhost:8080/keygo-server}"
  bootstrap:
    enabled: true
    bypass-roles: ${KEYGO_BOOTSTRAP_BYPASS_ROLES:ADMIN,ADMIN_TENANT,USER,KEYGO_ADMIN,KEYGO_TENANT_ADMIN,KEYGO_USER}
    api-path-prefix: "/api/"
    actuator-path-prefix: "/actuator/"
    service-info-path-prefix: "/service/info"
    swagger-ui-path-prefix: "/swagger-ui"
    api-docs-path-prefix: "/v3/api-docs"
    well-known-path-prefix: "/.well-known"
    userinfo-path-suffix: "/userinfo"
    revocation-path-suffix: "/oauth2/revoke"
    register-path-suffix: "/register"
    verify-email-path-suffix: "/verify-email"
    resend-verification-path-suffix: "/resend-verification"
    account-profile-path-suffix: "/account/profile"
    authorize-path-suffix: "/oauth2/authorize"
    login-path-suffix: "/account/login"
    token-path-suffix: "/oauth2/token"
    billing-catalog-path-suffix: "/billing/catalog"
    billing-contracts-path-suffix: "/billing/contracts"
    account-change-password-path-suffix: "/account/change-password"
    account-sessions-path-suffix: "/account/sessions"
    account-notification-preferences-path-suffix: "/account/notification-preferences"
    account-access-path-suffix: "/account/access"
    account-reset-password-path-suffix: "/account/reset-password"
    account-forgot-password-path-suffix: "/account/forgot-password"
    account-recover-password-path-suffix: "/account/recover-password"
    # Platform auth paths (RFC restructure-multitenant)
    platform-login-path-prefix: "/api/v1/platform/account/login"
    platform-token-path-prefix: "/api/v1/platform/oauth2/token"
    platform-revoke-path-prefix: "/api/v1/platform/oauth2/revoke"
    platform-authorize-path-prefix: "/api/v1/platform/oauth2/authorize"
    platform-direct-login-path-prefix: "/api/v1/platform/account/direct-login"
    platform-forgot-password-path-prefix: "/api/v1/platform/account/forgot-password"
    platform-check-email-path-prefix: "/api/v1/platform/account/check-email"
    platform-recover-password-path-prefix: "/api/v1/platform/account/recover-password"
    platform-reset-password-path-prefix: "/api/v1/platform/account/reset-password"
  tracing:
    # Habilita el log DEBUG de input/output por método (KeyGoTracingAspect).
    # Requiere que el nivel DEBUG esté activo para io.cmartinezs.keygo en logback-spring.xml.
    # Poner en false en producción si el overhead de reflexión es inaceptable.
    method-logging-enabled: true
  billing:
    mock-payment-enabled: true
    contract-expiry-hours: 48
    default-currency: MXN
  platform:
    allowed-redirect-uris:
      - "${KEYGO_PLATFORM_REDIRECT_URI:http://localhost:5173/callback}"
      - "http://localhost:5173/platform/callback"
    application-name: "${KEYGO_PLATFORM_APP_NAME:KeyGo Platform}"
  mail:
    from: "${KEYGO_MAIL_FROM:noreply@keygo.example.com}"
    app-name: "${KEYGO_MAIL_APP_NAME:KeyGo}"
  ui:
    base-url: "${KEYGO_UI_BASE_URL:http://localhost:5173}"
    paths:
      verify-email:
        route: "/verify-email"
        query-params:
          - email
      reset-password:
        route: "/reset-password"
        query-params:
          - reset_code_id
      recovery:
        route: "/forgot-password"
        query-params:
          - tenant_slug
      login:
        route: "/login"
        query-params: []
      subscribe:
        route: "/subscribe"
        query-params:
          - contract_id
          - resume
      dashboard:
        route: "/dashboard"
        query-params: []
  email:
    smtp-host: "${SMTP_HOST:localhost}"
    smtp-port: "${SMTP_PORT:587}"
    template-cache-enabled: true
    default-from-address: "${KEYGO_MAIL_FROM:noreply@keygo.local}"
    default-from-name: "${KEYGO_MAIL_APP_NAME:KeyGo}"
    copyright-holder: "KeyGo"
    footer-links:
      - label: "keygo.io"
        url: "https://keygo.io"
      - label: "Política de privacidad"
        url: "https://keygo.io/privacy"
      - label: "Seguridad"
        url: "https://keygo.io/security"
      - label: "Soporte"
        url: "https://keygo.io/support"
    types:
      email-verification:
        subject: "Verifica tu email en KeyGo"
        from-name: "KeyGo - Verificación"
        template: "html/email-validation"
        defaults:
          theme: "theme-brand"
          headerTitle: "Verifica tu email"
          headerSubtitle: "¡Bienvenido a KeyGo!"
          expiresInMinutes: 30
          ctaLabel: "Verificar mi email"
          ctaHint: "O haz clic para ir directamente a la verificación:"
        links:
          actionUrl: "verify-email"
        subjects-i18n:
          en: "Verify your email on KeyGo"
      password-recovery:
        subject: "Restablecer tu contraseña en KeyGo"
        from-name: "KeyGo - Seguridad"
        template: "html/password-recovery"
        defaults:
          theme: "theme-security"
          headerTitle: "Restablecer contraseña"
          headerSubtitle: "Recupera tu acceso a KeyGo"
          ctaLabel: "Restablecer contraseña"
          ctaHint: "O accede directamente al formulario:"
        links:
          actionUrl: "recovery"
        subjects-i18n:
          en: "Reset your password on KeyGo"
      password-reset-code:
        subject: "Código para restablecer tu contraseña en KeyGo"
        from-name: "KeyGo - Seguridad"
        template: "html/password-reset-code"
        defaults:
          theme: "theme-brand"
          headerTitle: "Cambio de contraseña"
          headerSubtitle: "Actualiza tu contraseña en KeyGo"
          expiresInMinutes: 15
          ctaLabel: "Cambiar contraseña"
          ctaHint: "O accede directamente al formulario:"
        links:
          actionUrl: "reset-password"
        subjects-i18n:
          en: "Password reset code — KeyGo"
      temporary-password:
        subject: "Tu contraseña temporal en KeyGo"
        from-name: "KeyGo - Cuenta"
        template: "html/temporary-password"
        defaults:
          theme: "theme-brand"
          headerTitle: "Contraseña temporal"
          headerSubtitle: "Acceso inicial a KeyGo"
          ctaLabel: "Iniciar sesión"
          ctaHint: "O accede directamente para iniciar sesión:"
        links:
          actionUrl: "login"
        subjects-i18n:
          en: "Your temporary password on KeyGo"
      contract-verification:
        subject: "Verifica tu email para completar la suscripción"
        from-name: "KeyGo - Suscripción"
        template: "html/contract-verification"
        defaults:
          theme: "theme-brand"
          headerTitle: "Confirma tu email"
          headerSubtitle: "Completa tu suscripción a KeyGo"
          expiresInMinutes: 30
          ctaLabel: "Continuar con mi suscripción"
          ctaHint: "O haz clic para continuar directamente:"
        links:
          actionUrl: "subscribe"
        subjects-i18n:
          en: "Verify your email to complete subscription"
      membership-approved:
        subject: "Tu acceso ha sido aprobado — KeyGo"
        from-name: "KeyGo - Acceso"
        template: "html/membership-approved"
        defaults:
          theme: "theme-success"
          headerTitle: "✅ Acceso aprobado"
          headerSubtitle: "¡Tu membresía ha sido activada!"
          ctaLabel: "Ir a mi panel"
          ctaHint: "Accede directamente a tu panel:"
        links:
          actionUrl: "dashboard"
        subjects-i18n:
          en: "Your access has been approved — KeyGo"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
spring:
  application:
    name: "${keygo.info.name}-${keygo.info.version}"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:default}"
  mail:
    host: "${SMTP_HOST:localhost}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  messages:
    basename: classpath:i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
server:
  port: "${PORT:8080}"
  servlet:
    context-path: "/${keygo.info.name}"
    application-display-name: "${spring.application.name}"
