<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  Fragment: styles — CSS compartido para todos los emails de KeyGo.
  Incluye reset, layout, tipografía, temas, componentes y responsive.
  Uso: <th:block th:replace="~{html/fragments/styles :: styles}" />
-->
<body>
<th:block th:fragment="styles">
<style>
    /* ── Google Fonts ─────────────────────────────────────────── */
    @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 400;
        src: url(https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxKKTU1Kg.woff2) format('woff2');
    }

    /* ── Reset y base ─────────────────────────────────────────── */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        background-color: #f5f5f5;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .email-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
    }

    .email-header h1 {
        margin: 0 0 8px 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .email-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.95;
    }

    .email-body {
        padding: 40px 30px;
    }

    .email-footer {
        background-color: #f9f9f9;
        padding: 24px 30px;
        text-align: center;
        font-size: 12px;
        color: #999;
        border-top: 1px solid #e0e0e0;
    }

    .email-footer p {
        margin: 4px 0;
    }

    /* ── Temas (gradientes del header + acentos) ──────────────── */
    /* Default: theme-brand (púrpura-azul) — definido arriba en .email-header */

    .theme-security .email-header {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .theme-success .email-header {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }

    /* ── Tipografía ───────────────────────────────────────────── */
    .greeting {
        margin-bottom: 24px;
        font-size: 16px;
        line-height: 1.8;
    }

    .greeting strong {
        color: #667eea;
        font-weight: 600;
    }

    .theme-security .greeting strong {
        color: #f5576c;
    }

    .theme-success .greeting strong {
        color: #28a745;
    }

    .section-title {
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin: 24px 0 16px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* ── Links ─────────────────────────────────────────────────── */
    a {
        color: #667eea;
        text-decoration: none;
    }

    a:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    .theme-security a {
        color: #f5576c;
    }

    .theme-security a:hover {
        color: #e74c3c;
    }

    .theme-success a {
        color: #28a745;
    }

    .theme-success a:hover {
        color: #20c997;
    }

    /* ── Code box (códigos de verificación) ────────────────────── */
    .code-container {
        background-color: #f9f9f9;
        border-left: 4px solid #667eea;
        padding: 20px;
        margin: 24px 0;
        border-radius: 4px;
    }

    .theme-security .code-container {
        border-left-color: #f5576c;
    }

    .code-box {
        display: inline-block;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
        letter-spacing: 4px;
        word-break: break-all;
    }

    .theme-security .code-box {
        color: #f5576c;
    }

    .code-info {
        font-size: 13px;
        color: #666;
        margin-top: 12px;
    }

    /* Variante: password (más compacto, con borde) */
    .code-container.variant-password .code-box {
        font-size: 18px;
        letter-spacing: 2px;
        padding: 12px;
        background-color: white;
        border: 1px solid #667eea;
        border-radius: 4px;
        min-width: 100%;
    }

    /* ── Notice boxes ──────────────────────────────────────────── */
    .notice {
        padding: 16px;
        margin: 24px 0;
        border-radius: 4px;
        font-size: 14px;
        border-left: 4px solid;
    }

    .notice strong {
        font-weight: 600;
    }

    .notice-warning {
        background-color: #fff3cd;
        border-left-color: #ffc107;
        color: #856404;
    }

    .notice-warning strong {
        color: #333;
    }

    .notice-security {
        background-color: #ffe6e6;
        border-left-color: #f5576c;
        color: #c0392b;
    }

    .notice-security strong {
        color: #a93226;
    }

    .notice-info {
        background-color: #ecf0f1;
        border-left-color: #95a5a6;
        color: #555;
    }

    .notice-info strong {
        color: #333;
    }

    .notice-success {
        background-color: #d4edda;
        border-left-color: #28a745;
        color: #155724;
    }

    .notice-success strong {
        color: #155724;
    }

    /* ── Highlight box (app name, contract info) ───────────────── */
    .highlight-box {
        background-color: #ecf0f1;
        border-left: 4px solid #667eea;
        padding: 16px;
        margin: 24px 0;
        border-radius: 4px;
        font-size: 14px;
        color: #555;
    }

    .highlight-box strong {
        color: #333;
        font-weight: 600;
    }

    .highlight-box .highlight-value {
        font-family: 'Courier New', monospace;
        word-break: break-all;
        margin-top: 4px;
    }

    .theme-success .highlight-box {
        border-left-color: #28a745;
        background-color: #d4edda;
    }

    .theme-success .highlight-box .highlight-title {
        font-size: 20px;
        font-weight: bold;
        color: #155724;
    }

    .theme-success .highlight-box .highlight-status {
        font-size: 14px;
        color: #155724;
        margin-top: 8px;
    }

    /* ── CTA Button ────────────────────────────────────────────── */
    .cta-container {
        margin: 32px 0;
        text-align: center;
    }

    .cta-text {
        font-size: 14px;
        color: #666;
        margin-bottom: 12px;
    }

    .btn-primary {
        display: inline-block;
        background-color: #667eea;
        color: white;
        padding: 14px 32px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        text-align: center;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #764ba2;
        text-decoration: none;
        color: white;
    }

    /* ── Instructions ──────────────────────────────────────────── */
    .instructions {
        font-size: 15px;
        line-height: 1.8;
        color: #555;
        margin: 24px 0;
    }

    .instructions li {
        margin-bottom: 12px;
    }

    /* ── Disclaimer ────────────────────────────────────────────── */
    .disclaimer {
        font-size: 12px;
        color: #999;
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid #e0e0e0;
        line-height: 1.6;
    }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 600px) {
        .email-container {
            border-radius: 0;
        }

        .email-header {
            padding: 30px 20px;
        }

        .email-header h1 {
            font-size: 24px;
        }

        .email-body {
            padding: 30px 20px;
        }

        .code-box {
            font-size: 20px;
            letter-spacing: 2px;
        }

        .code-container.variant-password .code-box {
            font-size: 14px;
            letter-spacing: 1px;
        }
    }
</style>
</th:block>
</body>
</html>
