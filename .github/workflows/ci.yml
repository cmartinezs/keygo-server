name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    name: Repository validation (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate local toolchain contract
        run: make deps

      - name: Run canonical repository validation
        run: make validate

      - name: Build deployable package
        run: make build

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
            keygo-run/target/site/jacoco-aggregate/
          retention-days: 14

# Hosted Actions may be disabled by organization policy/cost controls.
# Repository-local Makefile commands remain the portable source of validation behavior.
