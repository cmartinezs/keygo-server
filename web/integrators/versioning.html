<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Versioning — KeyGo Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared/keygo.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/code-data.js"></script>
<script src="../shared/layout.js" type="text/babel"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
function VersioningPage() {
  const { lang } = React.useContext(window.KG_LangCtx);
  const copy = lang === 'en'
    ? {
        eyebrow: 'For Integrators',
        title: 'Versioning and compatibility',
        desc: 'KeyGo currently publishes its REST surface under /api/v1. The contract stays stable within v1 for additive evolution, while breaking changes require a new path version.',
        callout: 'In the current codebase every documented controller, discovery endpoint and self-service route lives under /api/v1, including tenant and platform auth surfaces.',
        h2Model: 'Versioning model',
        model: [
          ['Base path', '/api/v1 for REST and auth routes.'],
          ['Tenant discovery', '/api/v1/tenants/public and tenant-scoped public app discovery.'],
          ['OIDC/JWKS', 'Well-known endpoints remain tenant/platform scoped inside the same major API line.'],
          ['OpenAPI', '/v3/api-docs and /swagger-ui.html document the live v1 contract.'],
        ],
        h2Compatibility: 'Compatibility rules',
        compatibility: [
          ['Non-breaking', 'Add optional fields, add endpoints, add success/error codes, extend enum consumption in clients defensively.'],
          ['Potentially breaking', 'Rename/remove fields, change required params, alter semantic meaning, or move paths.'],
          ['Major version trigger', 'Any incompatible payload, auth or route change should ship in a new base path such as /api/v2.'],
        ],
        h2Examples: 'Path examples',
        h2Lifecycle: 'Deprecation lifecycle',
        lifecycle: [
          ['1. Design', 'Document v2 first (RFC/ADR) and keep v1 unchanged while the new surface is built.'],
          ['2. Dual support', 'Run v1 and v2 in parallel; new integrations should target the newest stable line.'],
          ['3. Deprecation', 'Legacy responses should announce sunset through Deprecation, Sunset and successor-version link headers.'],
          ['4. Removal', 'Only remove v1 after the published sunset date and a migration window with monitoring.'],
        ],
        h2Headers: 'Deprecation headers',
        h2Deprecation: 'Consumer guidance',
        guidance: [
          'Parse unknown fields leniently; runtime Jackson configuration already accepts unknown input properties.',
          'Treat success.code / failure.code as stable business identifiers; do not infer business state only from HTTP status.',
          'Use X-Trace-ID in clients and logs so migrations or regressions can be correlated quickly.',
          'Prefer feature detection by endpoint or field presence instead of hard-coding implementation assumptions.',
        ],
        h2Links: 'Related pages',
      }
    : {
        eyebrow: 'Para Integradores',
        title: 'Versionado y compatibilidad',
        desc: 'KeyGo publica hoy su superficie REST bajo /api/v1. El contrato se mantiene estable dentro de v1 para evolución aditiva, mientras que cambios breaking requieren una nueva versión de path.',
        callout: 'En el código actual, todos los controllers documentados, endpoints discovery y rutas self-service viven bajo /api/v1, incluyendo las superficies auth de tenant y plataforma.',
        h2Model: 'Modelo de versionado',
        model: [
          ['Base path', '/api/v1 para rutas REST y auth.'],
          ['Discovery de tenants', '/api/v1/tenants/public y discovery público de apps por tenant.'],
          ['OIDC/JWKS', 'Los well-known endpoints siguen siendo tenant/platform scoped dentro de la misma línea mayor de API.'],
          ['OpenAPI', '/v3/api-docs y /swagger-ui.html documentan el contrato vivo de v1.'],
        ],
        h2Compatibility: 'Reglas de compatibilidad',
        compatibility: [
          ['No breaking', 'Agregar campos opcionales, nuevos endpoints, nuevos códigos success/error y extender enums consumiéndolos defensivamente.'],
          ['Potencialmente breaking', 'Renombrar/eliminar campos, cambiar parámetros requeridos, alterar significado semántico o mover paths.'],
          ['Disparador de major version', 'Cualquier cambio incompatible de payload, auth o rutas debería salir en un nuevo base path como /api/v2.'],
        ],
        h2Examples: 'Ejemplos de paths',
        h2Lifecycle: 'Lifecycle de deprecación',
        lifecycle: [
          ['1. Diseño', 'Documentar v2 primero (RFC/ADR) y mantener v1 sin cambios mientras se construye la nueva superficie.'],
          ['2. Soporte dual', 'Correr v1 y v2 en paralelo; las nuevas integraciones deberían usar la línea estable más reciente.'],
          ['3. Deprecación', 'Las respuestas legacy deberían anunciar sunset mediante headers Deprecation, Sunset y successor-version.'],
          ['4. Retiro', 'Eliminar v1 solo después de la fecha de sunset publicada y una ventana de migración monitoreada.'],
        ],
        h2Headers: 'Headers de deprecación',
        h2Deprecation: 'Guía para consumidores',
        guidance: [
          'Parsea campos desconocidos de forma tolerante; la configuración runtime de Jackson ya acepta propiedades de entrada desconocidas.',
          'Trata success.code / failure.code como identificadores de negocio estables; no infieras estado solo desde HTTP status.',
          'Usa X-Trace-ID en clientes y logs para correlacionar rápido migraciones o regresiones.',
          'Prefiere detección por presencia de endpoint o campo en lugar de asumir detalles internos rígidos.',
        ],
        h2Links: 'Páginas relacionadas',
      };
  const links = [
    ['../integrators/api-conventions.html', lang === 'en' ? 'API conventions' : 'Convenciones API'],
    ['../integrators/endpoints.html', 'Endpoints API'],
    ['../integrators/session-model.html', lang === 'en' ? 'Session model' : 'Modelo de sesión'],
  ];
  return (
    <>
      <div className="page-header">
        <div className="page-eyebrow" style={{ display:'flex', alignItems:'center', gap:6 }}><KG_Icon name="versioning" size={13} color="var(--green)" />{copy.eyebrow}</div>
        <h1 className="page-title">{copy.title}</h1>
        <p className="page-desc">{copy.desc}</p>
      </div>
      <div className="section">
        <KG_Callout type="info">{copy.callout}</KG_Callout>

        <h2>{copy.h2Model}</h2>
        <table className="bc-table">
          <thead><tr><th>{lang === 'en' ? 'Aspect' : 'Aspecto'}</th><th>{lang === 'en' ? 'Current rule' : 'Regla actual'}</th></tr></thead>
          <tbody>
            {copy.model.map(([aspect, rule]) => <tr key={aspect}><td className="bc-name">{aspect}</td><td>{rule}</td></tr>)}
          </tbody>
        </table>

        <h2>{copy.h2Compatibility}</h2>
        <table className="bc-table">
          <thead><tr><th>{lang === 'en' ? 'Change class' : 'Clase de cambio'}</th><th>{lang === 'en' ? 'Expected handling' : 'Manejo esperado'}</th></tr></thead>
          <tbody>
            {copy.compatibility.map(([kind, rule]) => <tr key={kind}><td className="bc-name">{kind}</td><td>{rule}</td></tr>)}
          </tbody>
        </table>

        <h2>{copy.h2Examples}</h2>
        <div className="diagram-block">
{`/api/v1/tenants/{tenant_slug}/oauth2/authorize
/api/v1/tenants/{tenant_slug}/oauth2/token
/api/v1/tenants/public
/api/v1/platform/oauth2/token
/api/v1/tenants/{tenant_slug}/.well-known/openid-configuration
/api/v1/tenants/{tenant_slug}/.well-known/jwks.json`}
        </div>

        <h2>{copy.h2Lifecycle}</h2>
        <table className="bc-table">
          <thead><tr><th>{lang === 'en' ? 'Phase' : 'Fase'}</th><th>{lang === 'en' ? 'Expected practice' : 'Práctica esperada'}</th></tr></thead>
          <tbody>
            {copy.lifecycle.map(([phase, rule]) => <tr key={phase}><td className="bc-name">{phase}</td><td>{rule}</td></tr>)}
          </tbody>
        </table>

        <h2>{copy.h2Headers}</h2>
        <div className="diagram-block">
{`HTTP/1.1 200 OK
Deprecation: true
Sunset: Sun, 10 Oct 2026 00:00:00 GMT
Link: </api/v2/tenants>; rel="successor-version"`}
        </div>

        <h2>{copy.h2Deprecation}</h2>
        <ul className="dense-list">
          {copy.guidance.map((item) => <li key={item}>{item}</li>)}
        </ul>

        <h2>{copy.h2Links}</h2>
        <div className="doc-links">
          {links.map(([href, label]) => <a key={href} className="doc-link" href={href}>{label}</a>)}
        </div>
      </div>
    </>
  );
}
KG_mountPage({ activeId: 'versioning', content: VersioningPage });
</script>
</body></html>
